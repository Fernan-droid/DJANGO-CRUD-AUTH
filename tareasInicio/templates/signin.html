{% extends 'base.html' %}

{% block content %}
    <main class="container">
        <div class="row">
            <div class="col-md-4 offset-md-4">
                <form method="POST" class="card card-body">
                    <h1 class="text-center">Signin</h1>
                    {{error}}
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username">Username:</label>
                        <input type="text" name="username" class="form-control" placeholder="Write your username" id="username">
                    </div>
                    <div class="mb-3">
                        <label for="password1">Password:</label>
                        <input type="password" name="password" class="form-control" placeholder="Write your password" id="password">
                    </div>
                    <button class="btn btn-primary">
                        Signup
                    </button>
                </form>
            </div>
        </div>
    </main>
{% endblock %}
