<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django CRUD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
</head>
<body>
    
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container">
            <a class="navbar-brand" href="/">Django App</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="/" class="nav-link active">Home</a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a href="/tasks" class="nav-link active">Tasks Pending</a>
                    </li>
                    <li class="nav-item">
                        <a href="/tasks/create" class="nav-link active">Create Task</a>
                    </li>
                    <li class="nav-item">
                        <a href="/tasks_completed" class="nav-link active">Tasks Completed</a>
                    </li>
                    <li class="nav-item">
                        <a href="/logout" class="nav-link active">Logout</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a href="/signin" class="nav-link active">Signin</a>
                    </li>
                    <li class="nav-item">
                        <a href="/signup" class="nav-link active">Signup</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
            </dialog>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
